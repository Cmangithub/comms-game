<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>EB Comms Game – CPD 9</title>

<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#2b2b2b;color:#f2f2f2;font-family:Segoe UI,Arial,sans-serif;font-size:16px;overflow:hidden}
body{display:flex;flex-direction:column}
button,select,input,textarea{background:#444;color:#fff;border:1px solid #666;border-radius:8px;padding:7px 9px;font-size:15px;font-family:inherit}
button{cursor:pointer;min-height:40px}button:hover{background:#555}button.pri{background:#e8e8e8;color:#222;font-weight:700}button.on{background:#cfe8ff;color:#222;font-weight:700}
header{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 10px;background:#333;border-bottom:1px solid #555}

#timer{font-size:20px;font-weight:700;font-family:Consolas,monospace}
#net{font-size:12px;padding:2px 8px;border-radius:10px;background:#555;white-space:nowrap}
#main{flex:1;display:flex;min-height:0}#mapbox{flex:1;position:relative;min-width:0;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#mapTools{position:absolute;left:6px;top:6px;display:flex;gap:4px;z-index:2;flex-wrap:wrap}#mapTools input{width:64px}#mapTools *{min-height:34px;padding:4px 8px;font-size:13px}
#umPop{display:none;position:absolute;left:6px;right:6px;top:48px;max-width:520px;background:rgba(40,40,40,.95);border:2px solid #9ef;border-radius:8px;padding:6px;z-index:3;font-size:14px}#umPop input{font-size:16px}#umList button{font-size:13px;padding:4px 6px}#umList button.on{background:#555;color:#fff;outline:3px solid #fff}
#readout{position:absolute;left:6px;bottom:6px;background:rgba(30,30,30,.88);padding:3px 8px;border-radius:6px;font-size:13px;z-index:2;max-width:95%}
#side{width:400px;flex:none;overflow-y:auto;border-left:1px solid #555;background:#303030;padding:8px}
body.comms #side{width:var(--sideW,40vw)}#drag{display:none;flex:none;background:#555;cursor:col-resize;width:10px;touch-action:none;align-items:center;justify-content:center;color:#bbb;font-size:12px}body.comms #drag{display:flex}#drag:hover{background:#777}
#msg900 .m{border:1px solid #666;border-radius:8px;padding:6px;margin:4px 0;background:#3d3d3d}#msg900 .m.new{border:3px solid #ffd54a;background:#4a4320}#msg900 img,#msg900 svg.ill{max-height:80px;display:inline-block!important;margin:4px 4px 0 0!important;max-width:100%;border-radius:6px;display:block;margin:4px 0;background:#fff}
.box{background:#383838;border:1px solid #555;border-radius:10px;padding:8px;margin-bottom:8px}.box h3{margin:0 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:#ddd}
.small{font-size:12px;color:#bbb}.note{font-size:12px;color:#bbb;font-style:italic}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}.tabs button{flex:1;min-width:70px;padding:6px 4px;font-size:13px}
.msg{border:1px solid #666;border-radius:10px;padding:8px;margin-bottom:8px;background:#3d3d3d}.msg.new{border:3px solid #ffd54a;background:#4a4320;animation:pulse 1s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(255,213,74,.6)}to{box-shadow:0 0 14px 4px rgba(255,213,74,.6)}}
.msg img,.msg svg.ill{max-width:100%;max-height:220px;border-radius:8px;display:block;margin:6px 0;background:#fff}
.badge{background:#e33;color:#fff;border-radius:12px;padding:1px 8px;font-weight:700;font-size:13px}
#pop .msg img,#pop .msg svg.ill{max-height:150px}#pop{position:fixed;right:10px;top:56px;width:min(380px,94vw);max-height:80vh;overflow-y:auto;z-index:18;display:none;background:#333;border:3px solid #ffd54a;border-radius:12px;padding:10px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#overlay{position:fixed;inset:0;background:#2b2b2b;z-index:20;overflow-y:auto;padding:18px;display:none}#overlay .in{max-width:760px;margin:0 auto;font-size:18px;line-height:1.45}
#reveal{position:fixed;left:50%;top:56px;transform:translateX(-50%);width:min(980px,97vw);max-height:84vh;overflow-y:auto;background:#333;border:2px solid #ccc;border-radius:12px;padding:12px;z-index:19;display:none;font-size:14px}
table{border-collapse:collapse}td,th{border:1px solid #666;padding:3px 5px;text-align:left;font-size:13px;vertical-align:top}
.tblwrap{overflow-x:auto;max-width:100%}
#clog th{background:#444;position:sticky;top:0}#clog td:first-child,#clog th:first-child{position:sticky;left:0;background:#3a3a3a;z-index:1;font-weight:700;text-align:center}
#clog input{width:100%;min-width:92px;padding:6px;font-size:14px;border-radius:5px}#clog td.tm{min-width:124px;white-space:nowrap}#clog td.tm input{width:68px;min-width:68px}#clog td.tm button{min-height:32px;padding:2px 6px;font-size:12px;margin-left:2px}
.big{font-size:40px;font-weight:800;letter-spacing:6px}
.st-sent{color:#ffd54a}.st-seen{color:#7fd0ff}.st-done{color:#8c8}

LQ.forEach(a=>lbl(...a));LQ=[];const R=s.reveal;if(R&&R.units)R.units.forEach(r=>{if(r.px!=null){x.strokeStyle='#ff4';x.lineWidth=5;x.beginPath();x.moveTo(r.x,r.y);x.lineTo(r.px,r.py);x.stroke()}if(role=='comms')drawUnit({cs:r.cs,x:r.x,y:r.y},false);if(r.px!=null)lbl(r.cs+': '+r.err+' sq off',r.x,r.y+70,'#ff4','#000',26)})}
const ptrs=new Map();let moved=false,pinch0=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY,sx:e.offsetX,sy:e.offsetY});moved=false;itemDrag=ptrs.size==1&&!itemPlace?itemHit(...toW(e.offsetX,e.offsetY)):null;umDrag=ptrs.size==1&&!pinMode&&!itemDrag?umHit(...toW(e.offsetX,e.offsetY)):null;if(umDrag)e.preventDefault();if(ptrs.size==2){const[a,b]=[...ptrs.values()];pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),s:VIEW.s}}});
cv.addEventListener('pointermove',e=>{const[wx,wy]=toW(e.offsetX,e.offsetY);hoverG=gref(wx,wy);const l=L.find(z=>Math.hypot(z.x-wx,z.y-wy)<60);$('readout').textContent=(hoverG?'Grid '+hoverG+' ('+sayGrid(hoverG)+')':'')+(l?' · '+l.n:'');
const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.offsetX-p.x,dy=e.offsetY-p.y;if(Math.hypot(e.offsetX-p.sx,e.offsetY-p.sy)>8)moved=true;if(ptrs.size==1&&moved){if(itemDrag){const[a,b2]=toW(e.offsetX,e.offsetY);itemDrag.x=Math.round(a);itemDrag.y=Math.round(b2)}else if(umDrag){const[a,b2]=toW(e.offsetX,e.offsetY);UM[umDrag].x=a;UM[umDrag].y=b2}else{VIEW.ox+=dx;VIEW.oy+=dy}}p.x=e.offsetX;p.y=e.offsetY;
if(ptrs.size==2&&pinch0){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt(pinch0.s*d/pinch0.d/VIEW.s,(a.x+b.x)/2,(a.y+b.y)/2)}});
cv.addEventListener('pointerup',e=>{const was=ptrs.size;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=null;if(itemDrag){itemDrag=null;if(moved){renderSide();return}}if(umDrag){const c=umDrag;umDrag=null;if(moved){umSel=c;umMove(c,...toW(e.offsetX,e.offsetY));flash(c+' marker moved to '+gref(UM[c].x,UM[c].y));return}if(was==1){umSel=umSel==c?null:c;flash(umSel?c+' selected – tap the map to move it there':'Deselected');return}}if(!moved&&was==1)tap(...toW(e.offsetX,e.offsetY))});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.offsetX,e.offsetY)},{passive:false});

function centreOn(x0,y0){const r=$('mapbox').getBoundingClientRect();VIEW.s=Math.max(VIEW.s,.45);VIEW.ox=r.width/2-x0*VIEW.s;VIEW.oy=r.height/2-y0*VIEW.s;hoverG=gref(x0,y0)}
function m9Key(){return 'ebMsg900_'+(MODE=='host'?'host'+(S&&S.code):ME.code)}
function m9Store(){let a=[];try{a=JSON.parse(localStorage.getItem(m9Key())||'[]')}catch(e){}let ch=false;Object.values(JOBS).filter(j=>j.to=='900').forEach(j=>{const k=j.id+'_'+j.t;const o=a.find(q=>q.k==k);if(!o){a.push({k,id:j.id,rt:now(),title:j.title,details:j.details,icon:j.icon,img:j.img,x:j.x,y:j.y,grid:j.grid,resolved:j.resolved});ch=true}else if(o.resolved!=j.resolved){o.resolved=j.resolved;ch=true}});if(ch)try{localStorage.setItem(m9Key(),JSON.stringify(a))}catch(e){try{a.forEach((q,i)=>{if(i<a.length-5)q.img=''});localStorage.setItem(m9Key(),JSON.stringify(a))}catch(e2){}}return a}
function renderMsg900(){const el=$('msg900');if(!el)return;const js=m9Store().map(q=>Object.assign({},q,{t:q.rt})).sort((a,b)=>b.rt-a.rt);js.forEach((j,i)=>j.__s=i>0||seenJobs.has(j.id)||!JOBS[j.id]);
if(!js.length){el.innerHTML='<h3>Messages from facilitator</h3><div class="small">None yet. Caller reports and private location pins will appear here.</div>';return}
const one=(j,top)=>`<div class="m ${j.__s?'':'new'}">${j.__s?'':'<span class="badge">NEW</span> '}<b>${esc(j.title)}</b>${j.resolved?' <span class="small">· resolved</span>':''} <span class="small">${hhmm(j.t)}</span>${top&&j.details?'<div style="white-space:pre-wrap">'+esc(j.details)+'</div>':(!top&&j.details?' – <span class="small">'+esc(j.details.slice(0,80))+'</span>':'')}${top?(j.icon&&ICONS[j.icon]?ICONS[j.icon][1]:'')+(j.img?'<img src="'+j.img+'">':''):''}
<div class="row">${j.x!=null?`<button onclick="centreOn(${Math.round(j.x)},${Math.round(j.y)})">📍 Show pin${j.grid?' ('+j.grid+')':''}</button>`:''}${j.__s?'':`<button class="pri" onclick="ackJob(${j.id});renderMsg900()">Got it</button>`}</div></div>`;
el.innerHTML='<h3>Messages from facilitator ('+js.length+')</h3><div id="m9list" style="max-height:34vh;overflow-y:auto">'+js.map((j,i)=>one(j,true)).join('')+'</div>'}
function applySplit(){const sp=JSON.parse(localStorage.getItem('ebSplit')||'{}');const root=document.documentElement.style;root.setProperty('--sideW',(sp.w||40)+'vw');root.setProperty('--mapH',(sp.h||55)+'vh');$('bSplit').style.display=document.body.classList.contains('comms')?'':'none';setTimeout(fit,30)}
function setSplit(o){const sp=Object.assign(JSON.parse(localStorage.getItem('ebSplit')||'{}'),o);localStorage.setItem('ebSplit',JSON.stringify(sp));applySplit()}
function afterRender(){const g=id=>$(id);renderMsg900();renderUmList();renderUmPop();if(g('tblBox'))g('tblBox').ontoggle=e=>localStorage.setItem('ebTbl',e.target.open?'open':'closed');
if(g('qr')&&window.qrcode){try{const q=qrcode(0,'M');q.addData(playerURL());q.make();g('qr').innerHTML=q.createSvgTag(3,0)}catch(e){}}
if(g('jfTo')){const b=()=>{JF.to=g('jfTo').value;JF.type=g('jfType').value;JF.title=g('jfTitle').value;JF.details=g('jfDet').value;JF.icon=g('jfIcon').value;JF.move=g('jfMove').checked;JF.vis=document.querySelector('input[name=jfVis]:checked').value};
['jfTo','jfType','jfTitle','jfDet','jfIcon','jfMove'].forEach(i=>{g(i).oninput=b;g(i).onchange=b});document.querySelectorAll('input[name=jfVis]').forEach(r=>r.onchange=b);
g('jfTo').onchange=()=>{b();if(JF.to=='900'){JF.type='comms';JF.title='Caller report'}else if(JF.type=='comms'){JF.type='patient'}renderSide()};g('jfType').onchange=()=>{b();if(JF.type=='comms')JF.to='900';else if(JF.to=='900')JF.to='';JF.title=JF.type=='patient'?'Patient '+(S.jobs.filter(j=>j.type=='patient').length+1):JF.type=='comms'?'Caller report':'';renderSide()};g('jfGrid').onchange=()=>{JF.grid=g('jfGrid').value;JF.x=JF.y=null;JF.locName='';renderSide()};g('jfLoc').onchange=()=>{JF.locName=g('jfLoc').value;JF.x=JF.y=null;JF.grid='';renderSide()};
g('jfFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);JF.img=c.toDataURL('image/jpeg',.7);renderSide()};im.src=r.result};r.readAsDataURL(f)};
g('jfSend').onclick=()=>{b();sendJob()}}
if(g('clogView'))renderClogView();
if(g('clog')){g('clog').querySelectorAll('input').forEach(i=>i.oninput=()=>{CLOG.rows[+i.dataset.r][+i.dataset.k]=i.value;clearTimeout(window.__ct);window.__ct=setTimeout(saveClog,300)});
g('clog').querySelectorAll('button[data-now]').forEach(b=>b.onclick=()=>{const[r,k]=b.dataset.now.split(',').map(Number);CLOG.rows[r][k]=hhmm(now());b.previousSibling.value=CLOG.rows[r][k];saveClog()});
if(g('cNotes'))g('cNotes').oninput=()=>{CLOG.notes=g('cNotes').value;clearTimeout(window.__ct);window.__ct=setTimeout(saveClog,300)}}
renderHdr()}
function showReveal(){const R=(SNAP&&SNAP.reveal)||(S&&S.reveal);if(!R)return;const el=$('reveal');el.style.display='block';const rows=(R.clog.rows&&R.clog.rows.length?R.clog.rows:[]);
el.innerHTML=`<div class="row" style="justify-content:space-between"><b style="font-size:20px">Reveal – what really happened vs the comms log</b><button onclick="$('reveal').style.display='none'">Close</button></div>
<div style="display:flex;gap:12px;flex-wrap:wrap"><div style="flex:1;min-width:300px"><h3>Facilitator's jobs (truth)</h3><div class="tblwrap"><table><tr><th>#</th><th>Sent</th><th>To</th><th>Type / title</th><th>True location</th><th>Case no.</th></tr>${R.jobs.map(j=>`<tr><td>${j.id}</td><td>${hhmm(j.t)}</td><td>${esc(j.to)}</td><td>${TYPES[j.type][0]}: ${esc(j.title)}</td><td>${j.grid?j.grid+' '+esc(j.locName||''):'—'}</td><td>${esc(j.match||'—')}</td></tr>`).join('')||'<tr><td colspan=6>No jobs</td></tr>'}</table></div></div>
<div style="flex:1;min-width:300px"><h3>Comms officer's case log</h3><div class="tblwrap"><table><tr><th>Case</th>${LOGCOLS.map(h=>'<th>'+h+'</th>').join('')}</tr>${rows.map((r,i)=>r.some(v=>v)?'<tr><td>'+(i+1)+'</td>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>':'').join('')||'<tr><td colspan=7>Empty</td></tr>'}</table></div><div class="small"><b>Notes:</b> ${esc(R.clog.notes||'—')}</div></div></div>
<h3>Units: true position vs 900's marker</h3><div class="tblwrap"><table><tr><th>Unit</th><th>True grid</th><th>900 marker</th><th>Off by (grid squares)</th></tr>${R.units.map(u=>`<tr><td>${esc(u.cs)}</td><td>${u.g}</td><td>${u.pg||'—'}${u.pg&&!u.mv?' <span class=small>(never moved)</span>':''}</td><td style="color:${u.err==null?'#ccc':u.err==0?'#8f8':u.err<=2?'#ff4':'#f88'}"><b>${u.err==null?'—':u.err+' sq'}</b></td></tr>`).join('')}</table></div><div class="note">Discuss: what was missed, late, or logged at the wrong location? No automatic grade.</div>`}
function setNet(t,ok){$('net').textContent=t;$('net').style.background=ok?'#2e6b2e':'#555'}
$('mStyle').value=mstyle;$('mStyle').onchange=e=>{mstyle=e.target.value;localStorage.setItem('ebGameStyle',mstyle)};
$('bFit').onclick=fit;$('bZin').onclick=()=>{const r=$('mapbox').getBoundingClientRect();zoomAt(1.3,r.width/2,r.height/2)};$('bZout').onclick=()=>{const r=$('mapbox').getBoundingClientRect();zoomAt(1/1.3,r.width/2,r.height/2)};
$('bJump').onclick=()=>{const p=gridToXY($('gridJump').value);if(!p)return;const r=$('mapbox').getBoundingClientRect();VIEW.s=Math.max(VIEW.s,.6);VIEW.ox=r.width/2-p[0]*VIEW.s;VIEW.oy=r.height/2-p[1]*VIEW.s;hoverG=gref(p[0],p[1])};
$('bHelp').onclick=()=>{$('overlay').style.display='block';$('ovIn').innerHTML=`<h2>How to play</h2><ol><li>One person is <b>900, the Comms Officer</b>. Their map is <b>empty</b> – they can't see units, patients or incidents. They log every case in the table.</li><li>Everyone else is a <b>responder</b> with a call sign. You see the real map and move by tapping it.</li><li>The facilitator sends you <b>jobs</b> (a patient, a fire, "you're busting for the toilet"…). They pop up on your screen.</li><li><b>Tell 900 on Zoom</b>, using radio phrasing: who you're calling, who you are, exact location (grid + landmark), what you have. Tell 900 <b>before you move</b>.</li><li>Found a patient? Report to 900 first. <b>Don't respond unless 900 despatches you.</b></li><li>At the end the facilitator <b>reveals</b> what really happened next to 900's log.</li></ol>${quickCard()}<button class="pri" onclick="$('overlay').style.display='none'">Close</button>`};
window.addEventListener('resize',()=>fit());
$('bSplit').onclick=()=>{const sp=JSON.parse(localStorage.getItem('ebSplit')||'{}');if(innerWidth<820)setSplit({h:(sp.h||55)>=55?28:70});else setSplit({w:(sp.w||40)<=40?65:28})};
(()=>{let dr=null;const d=$('drag');d.addEventListener('pointerdown',e=>{d.setPointerCapture(e.pointerId);dr=1});d.addEventListener('pointermove',e=>{if(!dr)return;if(innerWidth<820){const top=$('main').getBoundingClientRect().top;setSplit({h:Math.max(20,Math.min(80,Math.round((e.clientY-top)/innerHeight*100)))})}else setSplit({w:Math.max(20,Math.min(75,Math.round((innerWidth-e.clientX)/innerWidth*100)))})});d.addEventListener('pointerup',()=>dr=null)})();
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('[data-item]');if(!b)return;palDrag={k:b.dataset.item,sx:e.clientX,sy:e.clientY};e.preventDefault()});
document.addEventListener('pointerup',e=>{if(!palDrag)return;const pd=palDrag;palDrag=null;const r=cv.getBoundingClientRect();const far=Math.hypot(e.clientX-pd.sx,e.clientY-pd.sy)>10;
if(far&&e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){const[wx,wy]=toW(e.clientX-r.left,e.clientY-r.top);hostView='true';addItem(pd.k,wx,wy)}else if(!far){itemPlace=itemPlace==pd.k?null:pd.k;renderSide()}});
cv.addEventListener('dblclick',e=>{const it=itemHit(...toW(e.offsetX,e.offsetY));if(it){S.items=S.items.filter(q=>q!==it);renderSide()}});
fit();if(IS_DEMO)hostStart(true);else if(IS_HOST)hostStart(false);else renderSide();draw();
